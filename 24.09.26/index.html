<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div class="container">

        <h1 id="titulo">meu planejador de estudos</h1>
        <h2>Nova tarefa</h2>

        <input type="text" id="tarefa" placeholder="Digite sua tarefa">

        <input type="text" id="materia" placeholder="Digite a matéria">

        <select id="prioridade">
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
        </select>

        <button onclick="adicionarTarefa()">
            cadastrar tarefa
        </button>

        <button onclick="limparCampos()">
            limpar Campos
        </button>

        <p id="mensagem"></p>

        <div class="contadores">

            <p id="Contador"> Tarefas cadastradas: 0</p>
            <p id="ContadorConcluidas"> Tarefas concluídas: 0</p>
        </div>

        <button onclick="alterarModo()">
            Modo de concentração
        </button>

        <h2>Minhas tarefas</h2>

        <div id="listaTarefas"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
